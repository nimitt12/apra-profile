<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fff5e6">
    <title>Page not found — Aprajeeta Singh</title>
    <link rel="icon" href="/img/favicon-48.png" sizes="48x48" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Sans:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,600&display=swap" rel="stylesheet">
    <style>
        :root { --paper: #fff5e6; --ink: #1e0f2b; --rani: #ff3d8b; --marigold: #ffb627; --lilac: #b9a2ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: radial-gradient(circle, rgba(30, 15, 43, 0.12) 1.4px, transparent 1.6px) 0 0 / 24px 24px, var(--paper);
            color: var(--ink);
            font-family: 'DM Sans', system-ui, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        main { position: relative; }
        .hand { font-family: 'Caveat', cursive; font-size: 2rem; color: var(--rani); transform: rotate(-4deg); }
        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: clamp(7rem, 30vw, 20rem);
            line-height: 0.95;
            letter-spacing: -0.04em;
        }
        h1 span { display: inline-block; animation: wobble 2.4s ease-in-out infinite; }
        h1 span:nth-child(2) { font-style: italic; font-weight: 600; color: var(--rani); animation-delay: -0.8s; }
        h1 span:nth-child(3) { animation-delay: -1.6s; }
        @keyframes wobble { 50% { transform: translateY(-14px) rotate(-6deg); } }
        p { margin: 12px auto 36px; max-width: 34ch; font-size: clamp(1.1rem, 2vw, 1.3rem); }
        a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            height: 56px;
            padding: 0 30px;
            border-radius: 999px;
            border: 2px solid var(--ink);
            background: var(--marigold);
            color: var(--ink);
            font-weight: 700;
            text-decoration: none;
            box-shadow: 4px 4px 0 var(--ink);
            transition: translate 0.2s, box-shadow 0.2s;
        }
        a:hover { translate: -2px -2px; box-shadow: 7px 7px 0 var(--ink); }
        a:focus-visible { outline: 3px solid var(--rani); outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { h1 span { animation: none; } }
    </style>
</head>
<body>
    <main>
        <p class="hand">oops!</p>
        <h1 aria-label="404"><span>4</span><span>0</span><span>4</span></h1>
        <p>This page wandered off, like a story that never got written. Let's find you a better one.</p>
        <a href="/blog/">Read the blog →</a>
    </main>
</body>
</html>
